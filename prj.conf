
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_LOG=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="Pansement"
CONFIG_BT_MAX_CONN=2
CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_BT_SMP=y
CONFIG_BT_SIGNING=y
CONFIG_NORDIC_SECURITY_BACKEND=y
CONFIG_MBEDTLS=y
CONFIG_BT_SMP=y
CONFIG_JSON_LIBRARY=y

# --- Modifications pour augmenter le MTU ---

# 1. Augmenter la taille physique des buffers (Matériel)
# Permet de stocker des paquets de 251 octets en mémoire
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# 2. Augmenter la taille logique du paquet (Logiciel/L2CAP)
# C'est la valeur max que l'application a le droit d'utiliser (247 octets)
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y

# 3. Activer l'extension de longueur de données (Data Length Extension - DLE)
# Indispensable pour que le contrôleur accepte physiquement d'envoyer plus
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y