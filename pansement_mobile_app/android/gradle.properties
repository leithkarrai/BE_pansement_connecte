org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Use SDK 35 required by plugins (flutter_blue_plus_android, path_provider_android, etc.)
android.compileSdkVersion=35
android.targetSdkVersion=35

# Stabilité Kotlin/Gradle sur Windows (désactive le mécanisme "daemon" de compilation incrémentale).
# L'erreur observée côté Kotlin ressemble à un problème de communication RMI avec le daemon
# ("Une connexion établie a été abandonnée...").
org.gradle.daemon=false
org.gradle.parallel=false
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
